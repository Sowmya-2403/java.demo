<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
 <h1>FORM EXAMPLE</h1> 
 <form enctype="multipart/form-data" action="result.html" autocomplete="on">
    FirstName : <input type="text" name="fname" placeholder="Dont use symblos"size="20" required/><br><br>
    LastName  : <input type="text" name="lname" placeholder="Dont use symblos"size="20" required/><br><br>
    Email     : <input type="text" name="email" placeholder="Enter a Email"size="20" required/><br><br>
    Password  : <input type="password" name="pwsd" placeholder="Enter a Password"size="20" required/><br><br>
    Age       : <input type="number" name="age" placeholder="Enter a Age"size="20" required/><br><br>
    DOB       : <input type="datetime-local" name="age" placeholder="Enter the DOB"size="20" required/><br><br>
    Resume Upload: <input type="file" name="cv" placeholder="upload your Resume"size="20" required/><br><br>
    Gender    : <input type="radio" name="gender" >Male</input><br><br>
                <input type="radio" name="gender" >Female</input><br><br>
                <input type="radio" name="gender" >Others</input><br><br>
    Hobbies   :<input type="checkbox" name="Cricket">cricket</input><br><br>
               <input type="checkbox" name="volley ball" >volley ball</input><br><br>
               <input type="checkbox" name="shuttle" >shuttle</input><br><br>  
    Address   : <textarea placeholder="Enter your Address" minlength="10"></textarea>

    Choose a Number :<select name="" size="3">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        </select><br><br>
        <button type="submit">submit</button>
</form>
</body>
</html>
